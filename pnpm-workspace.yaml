# pnpm refuses dependency install scripts unless they are allowed here. Each of these downloads or
# checks a platform binary the app needs.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - daisyui@5.7.38
